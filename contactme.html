<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Argghhh</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ARGGHHH</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">Gallery</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contactme.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTACT -->
    <section class="container py-5">
        <div class="contact-box mx-auto">

            <h1 class="text-center mb-4">Contact Us</h1>

            <form id="whatsappForm">

                <input type="text" id="name" class="form-control mb-3" placeholder="Your Name" required>

                <input type="email" id="email" class="form-control mb-3" placeholder="Your Email" required>

                <textarea id="message" rows="5" class="form-control mb-3" placeholder="Your Message" required></textarea>

                <button type="submit" class="btn btn-dark w-100">
                    Send To WhatsApp
                </button>

            </form>

        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 ARGGHHH | Contact</p>
    </footer>

<script>
document.getElementById("whatsappForm").addEventListener("submit", function(e){

    e.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let message = document.getElementById("message").value;

    let whatsappMessage =
`Name: ${name}
Email: ${email}
Message: ${message}`;

    let phoneNumber = "27659898845";

    let whatsappURL =
`https://wa.me/${phoneNumber}?text=${encodeURIComponent(whatsappMessage)}`;

    window.open(whatsappURL, "_blank");
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
