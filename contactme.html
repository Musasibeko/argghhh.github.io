<!-- WhatsApp Contact Form -->
<section class="request-form bg-dark text-white py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h2 class="text-center mb-4">REQUEST A CALL</h2>
                <form id="whatsappContactForm">
                    <input type="text" class="form-control mb-3" id="name" placeholder="Your Name" required>
                    <input type="text" class="form-control mb-3" id="phone" placeholder="Phone Number" required>
                    <input type="email" class="form-control mb-3" id="email" placeholder="Email" required>
                    <textarea class="form-control mb-3" id="message" rows="4" placeholder="Message" required></textarea>
                    <button type="submit" class="btn btn-primary w-100">SEND VIA WHATSAPP</button>
                </form>
            </div>
        </div>
    </div>
</section>

<script>
    document.getElementById('whatsappContactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const message = document.getElementById('message').value;
        const whatsappMsg = `*New Contact Request*%0A%0A*Name:* ${name}%0A*Phone:* ${phone}%0A*Email:* ${email}%0A*Message:* ${message}`;
        window.open(`https://wa.me/27659898845?text=${whatsappMsg}`, '_blank');
    });
</script>
