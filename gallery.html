<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RXBL - Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html"><h1>RXBL</h1></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navmenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="gallery.html" class="nav-link active">Gallery</a></li>
                <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
            <!-- Cart Icon -->
            <li class="nav-item dropdown" style="list-style: none;">
                <a class="nav-link" href="#" id="cartDropdownBtn" role="button">
                    <i class="bi bi-cart3 fs-5"></i> <span class="badge bg-primary" id="cartCount">0</span>
                </a>
                <div class="dropdown-menu dropdown-menu-end p-3" id="cartDropdown" style="width: 300px; display: none;">
                    <h6>Shopping Cart</h6>
                    <div id="cartItems"></div>
                    <button id="checkoutBtn" class="btn btn-primary w-100 mt-2">Checkout via WhatsApp</button>
                </div>
            </li>
        </div>
    </div>
</nav>

<!-- Gallery Products -->
<section class="gallery py-5">
    <div class="container">
        <h2 class="text-center mb-4">Our Collection</h2>
        <div class="row g-4" id="productsContainer">
            <!-- Product 1 -->
            <div class="col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="pictures/product1.jpg" class="card-img-top" alt="T-Shirt">
                    <div class="card-body">
                        <h5>RXBL T-Shirt</h5>
                        <p class="price">R299</p>
                        <select class="form-select size-select mb-2">
                            <option>S</option><option>M</option><option>L</option><option>XL</option>
                        </select>
                        <button class="btn btn-dark add-to-cart" data-name="RXBL T-Shirt" data-price="299">Add to Cart</button>
                    </div>
                </div>
            </div>
            <!-- Product 2 -->
            <div class="col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="pictures/product2.jpg" class="card-img-top" alt="Hoodie">
                    <div class="card-body">
                        <h5>RXBL Hoodie</h5>
                        <p class="price">R599</p>
                        <select class="form-select size-select mb-2">
                            <option>S</option><option>M</option><option>L</option><option>XL</option>
                        </select>
                        <button class="btn btn-dark add-to-cart" data-name="RXBL Hoodie" data-price="599">Add to Cart</button>
                    </div>
                </div>
            </div>
            <!-- Add more products as needed -->
        </div>
    </div>
</section>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">Copyright &copy; 2025</p>
    </div>
</footer>

<script>
    let cart = [];

    function saveCart() { localStorage.setItem('rxblCart', JSON.stringify(cart)); updateCartUI(); }
    function loadCart() { const saved = localStorage.getItem('rxblCart'); if(saved) cart = JSON.parse(saved); updateCartUI(); }
    function updateCartUI() {
        document.getElementById('cartCount').innerText = cart.length;
        const container = document.getElementById('cartItems');
        if(container) {
            container.innerHTML = '';
            cart.forEach((item, idx) => {
                container.innerHTML += `<div class="mb-2"><small>${item.name} (${item.size}) - R${item.price}</small> <span class="text-danger" style="cursor:pointer" onclick="removeItem(${idx})">Remove</span></div>`;
            });
        }
    }
    function removeItem(idx) { cart.splice(idx,1); saveCart(); }
    document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', function() {
            const card = this.closest('.card-body');
            const name = this.getAttribute('data-name');
            const price = this.getAttribute('data-price');
            const sizeSelect = card.querySelector('.size-select');
            const size = sizeSelect ? sizeSelect.value : 'M';
            cart.push({ name, size, price });
            saveCart();
            alert(`${name} added to cart!`);
            const dropdown = document.getElementById('cartDropdown');
            if(dropdown) dropdown.style.display = 'block';
        });
    });
    document.getElementById('checkoutBtn')?.addEventListener('click', () => {
        if(cart.length === 0) return alert('Cart empty');
        let msg = 'Order Summary:%0A';
        cart.forEach((item, i) => msg += `${i+1}. ${item.name} (${item.size}) - R${item.price}%0A`);
        msg += '%0ATotal: R' + cart.reduce((sum,i)=>sum+Number(i.price),0);
        window.open(`https://wa.me/27659898845?text=${msg}`, '_blank');
    });
    document.getElementById('cartDropdownBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        const dd = document.getElementById('cartDropdown');
        dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
    });
    loadCart();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
