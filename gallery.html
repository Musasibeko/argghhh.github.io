<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rxblsociety | Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            padding-top: 80px;
        }

        /* Navbar */
        .navbar {
            background: #1a1a1a !important;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            padding: 1rem 0;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }

        .nav-link {
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #ff6b6b !important;
        }

        /* Page Header */
        .page-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid #ff6b6b;
            display: inline-block;
        }

        /* Professional Product Card */
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        /* Image Container - Preserves quality */
        .image-container {
            position: relative;
            overflow: hidden;
            background: #f5f5f5;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        /* Card Body */
        .card-body {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ff6b6b;
            margin-bottom: 1rem;
        }

        /* Size Selector */
        .size-select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            background: white;
            transition: all 0.3s ease;
        }

        .size-select:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 0 3px rgba(255,107,107,0.1);
        }

        /* Add to Cart Button */
        .add-to-cart-btn {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .add-to-cart-btn:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
        }

        /* Cart Drawer */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -450px;
            width: 400px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 30px rgba(0,0,0,0.15);
            transition: 0.3s ease;
            z-index: 1050;
            padding: 20px;
            overflow-y: auto;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        #closeCartBtn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        #closeCartBtn:hover {
            color: #ff6b6b;
        }

        .cart-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .cart-item-details {
            font-size: 0.85rem;
            color: #666;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity-btn {
            background: #e0e0e0;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quantity-btn:hover {
            background: #ff6b6b;
            color: white;
        }

        .remove-item {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .remove-item:hover {
            background: #c82333;
        }

        /* Footer */
        .footer {
            background: #1a1a1a;
            color: white;
            padding: 3rem 0 2rem;
            margin-top: 4rem;
        }

        .social-links a {
            color: white;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .social-links a:hover {
            color: #ff6b6b;
            transform: translateY(-3px);
        }

        #scrollTopBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: none;
            z-index: 99;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ff6b6b;
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #scrollTopBtn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding-top: 70px;
            }
            .cart-drawer {
                width: 100%;
                right: -100%;
            }
            .image-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">Rxblsociety</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="contactme.html">Contact</a></li>
                <li class="nav-item"><a class="nav-link" href="#" id="cartIcon"><i class="fas fa-shopping-cart"></i> Cart (<span id="cartCount">0</span>)</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Gallery Section -->
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 text-center">
            <h1 class="page-header">Our Collection</h1>
        </div>
    </div>
    <div class="row g-4" id="productGallery">
        <!-- Products loaded here -->
    </div>
</div>

<!-- Cart Drawer -->
<div id="cartDrawer" class="cart-drawer">
    <div class="cart-header">
        <h4>Shopping Cart</h4>
        <button id="closeCartBtn">&times;</button>
    </div>
    <div id="cartItems"></div>
    <div id="cartTotalContainer" style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #f0f0f0;">
        <h5>Total: R<span id="cartTotal">0</span></h5>
        <button id="checkoutBtn" class="btn btn-success w-100 mt-3">Order on WhatsApp</button>
        <button id="clearCartBtn" class="btn btn-secondary w-100 mt-2">Clear Cart</button>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <div class="row">
            <div class="col-12 text-center">
                <div class="social-links mb-4">
                    <a href="https://instagram.com" target="_blank" class="mx-3"><i class="fab fa-instagram fa-2x"></i></a>
                    <a href="https://twitter.com" target="_blank" class="mx-3"><i class="fab fa-twitter fa-2x"></i></a>
                    <a href="https://facebook.com" target="_blank" class="mx-3"><i class="fab fa-facebook fa-2x"></i></a>
                    <a href="https://wa.me/277698858845" target="_blank" class="mx-3"><i class="fab fa-whatsapp fa-2x"></i></a>
                </div>
                <p class="copyright mb-0">&copy; 2025 Rxblsociety. All rights reserved.</p>
            </div>
        </div>
    </div>
</footer>

<button id="scrollTopBtn"><i class="fas fa-arrow-up"></i></button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Products Database
    const products = [
        { id: 1, name: "Tie-Dye T-Shirt 1", price: 250, image: "pictures/shirt1.jpg" },
        { id: 2, name: "Tie-Dye T-Shirt 2", price: 250, image: "pictures/shirt2.jpg" },
        { id: 3, name: "Tie-Dye T-Shirt 3", price: 250, image: "pictures/shirt3.jpg" },
        { id: 4, name: "Tie-Dye T-Shirt 4", price: 250, image: "pictures/shirt4.jpg" },
        { id: 5, name: "Tie-Dye Hoodie 1", price: 450, image: "pictures/hoodie1.jpg" },
        { id: 6, name: "Tie-Dye Hoodie 2", price: 450, image: "pictures/hoodie2.jpg" },
        { id: 7, name: "Tie-Dye Hoodie 3", price: 450, image: "pictures/hoodie3.jpg" },
        { id: 8, name: "Tie-Dye Hoodie 4", price: 450, image: "pictures/hoodie4.jpg" }
    ];

    // Cart array
    let cart = JSON.parse(localStorage.getItem('rxblCart')) || [];

    // Save cart
    function saveCart() {
        localStorage.setItem('rxblCart', JSON.stringify(cart));
        updateCartUI();
    }

    // Update cart UI
    function updateCartUI() {
        // Update cart count
        const cartCount = document.getElementById('cartCount');
        if (cartCount) {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.innerText = totalItems;
        }

        // Update cart drawer
        const cartItemsDiv = document.getElementById('cartItems');
        const cartTotalSpan = document.getElementById('cartTotal');
        
        if (cartItemsDiv && cartTotalSpan) {
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<div class="text-center text-muted py-5">Your cart is empty</div>';
                cartTotalSpan.innerText = '0';
                return;
            }

            let html = '';
            let total = 0;
            
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-details">Size: ${item.size} | R${item.price}</div>
                            <div class="quantity-control mt-2">
                                <button class="quantity-btn" data-index="${index}" data-change="-1">-</button>
                                <span style="min-width: 30px; text-align: center;">${item.quantity}</span>
                                <button class="quantity-btn" data-index="${index}" data-change="1">+</button>
                            </div>
                        </div>
                        <button class="remove-item" data-index="${index}">Remove</button>
                    </div>
                `;
            });
            
            cartItemsDiv.innerHTML = html;
            cartTotalSpan.innerText = total;
            
            // Add event listeners for quantity buttons
            document.querySelectorAll('.quantity-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.getAttribute('data-index'));
                    const change = parseInt(this.getAttribute('data-change'));
                    const newQty = cart[idx].quantity + change;
                    
                    if (newQty <= 0) {
                        cart.splice(idx, 1);
                    } else {
                        cart[idx].quantity = newQty;
                    }
                    saveCart();
                });
            });
            
            // Add remove button listeners
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.getAttribute('data-index'));
                    cart.splice(idx, 1);
                    saveCart();
                });
            });
        }
    }

    // Add to cart
    function addToCart(product, size) {
        if (!size) {
            alert('Please select a size');
            return false;
        }
        
        const existing = cart.find(item => item.id === product.id && item.size === size);
        if (existing) {
            existing.quantity++;
        } else {
            cart.push({
                id: product.id,
                name: product.name,
                price: product.price,
                size: size,
                quantity: 1
            });
        }
        
        saveCart();
        alert(`✓ ${product.name} (${size}) added to cart`);
        return true;
    }

    // Render products
    function renderProducts() {
        const gallery = document.getElementById('productGallery');
        if (!gallery) return;
        
        gallery.innerHTML = '';
        
        products.forEach(product => {
            const col = document.createElement('div');
            col.className = 'col-md-3 col-sm-6';
            col.innerHTML = `
                <div class="product-card">
                    <div class="image-container">
                        <img src="${product.image}" class="product-img" alt="${product.name}" loading="lazy">
                    </div>
                    <div class="card-body">
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-price">R${product.price}</div>
                        <select class="size-select">
                            <option value="">Select Size</option>
                            <option value="S">Small (S)</option>
                            <option value="M">Medium (M)</option>
                            <option value="L">Large (L)</option>
                            <option value="XL">Extra Large (XL)</option>
                        </select>
                        <button class="add-to-cart-btn">Add to Cart</button>
                    </div>
                </div>
            `;
            
            const select = col.querySelector('.size-select');
            const button = col.querySelector('.add-to-cart-btn');
            
            button.addEventListener('click', () => {
                addToCart(product, select.value);
            });
            
            gallery.appendChild(col);
        });
    }

    // Checkout
    function checkout() {
        if (cart.length === 0) {
            alert('Your cart is empty');
            return;
        }
        
        let message = "🛍️ *RXBLSOCIETY ORDER* 🛍️\n\n";
        let total = 0;
        
        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            message += `• ${item.name} (${item.size}) x${item.quantity} = R${itemTotal}\n`;
        });
        
        message += `\n*TOTAL: R${total}*`;
        message += `\n\nPlease confirm my order. Thank you!`;
        
        const whatsappUrl = `https://wa.me/277698858845?text=${encodeURIComponent(message)}`;
        window.open(wh
            atsappUrl, '_blank');
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        renderProducts();
        updateCartUI();
        
        // Cart drawer controls
        const cartIcon = document.getElementById('cartIcon');
        const cartDrawer = document.getElementById('cartDrawer');
        const closeCartBtn = document.getElementById('closeCartBtn');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const clearCartBtn = document.getElementById('clearCartBtn');
        
        if (cartIcon) {
            cartIcon.addEventListener('click', (e) => {
                e.preventDefault();
                cartDrawer.classList.add('open');
            });
        }
        
        if (closeCartBtn) {
            closeCartBtn.addEventListener('click', () => {
                cartDrawer.classList.remove('open');
            });
        }
        
        if (checkoutBtn) {
            checkoutBtn.addEventListener('click', checkout);
        }
        
        if (clearCartBtn) {
            clearCartBtn.addEventListener('click', () => {
                if (confirm('Clear entire cart?')) {
                    cart = [];
                    saveCart();
                    alert('Cart cleared');
                }
            });
        }
        
        // Scroll to top
        const scrollBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollBtn.style.display = 'block';
            } else {
                scrollBtn.style.display = 'none';
            }
        });
        
        scrollBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    });
</script>
</body>
</html>
